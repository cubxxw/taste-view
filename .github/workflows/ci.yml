name: Site quality
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  site-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER_LOG_PATH: .wrangler/wrangler.log
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Install the committed dependency graph
        run: npm ci
      - name: Lint source
        run: npm run lint
      - name: Build and exercise local page and application storage
        run: npm test
      - name: Build the Vercel deployment target
        run: npm run build:vercel
