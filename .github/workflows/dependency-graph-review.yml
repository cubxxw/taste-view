name: Dependency graph review
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependency-graph:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.2'
      - name: Resolve a candidate without running package scripts
        run: npm update --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Preserve the candidate and audit before enforcing the gate
        shell: python
        run: |
          import base64, gzip, hashlib, json, os, pathlib, subprocess
          lock = pathlib.Path('package-lock.json').read_bytes()
          audit = subprocess.run(['npm', 'audit', '--json'], capture_output=True)
          report = json.loads(audit.stdout)
          counts = report.get('metadata', {}).get('vulnerabilities')
          if audit.returncode not in (0, 1) or not isinstance(counts, dict):
              raise SystemExit('The registry audit did not produce a valid vulnerability report')
          changed = subprocess.run(['git', 'diff', '--quiet', '--', 'package-lock.json']).returncode
          if changed not in (0, 1):
              raise SystemExit('Cannot compare the candidate with the committed lockfile')
          identity = {
              'checkout': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'parents': [line.removeprefix('parent ') for line in subprocess.check_output(['git', 'cat-file', '-p', 'HEAD'], text=True).split('\n\n', 1)[0].splitlines() if line.startswith('parent ')],
              'manifestSHA256': hashlib.sha256(pathlib.Path('package.json').read_bytes()).hexdigest(),
              'lockSHA256': hashlib.sha256(lock).hexdigest(),
              'auditExit': audit.returncode,
              'vulnerabilities': counts,
              'committedLockMatches': changed == 0,
          }
          parts = ['## Dependency candidate and audit', 'This report is source evidence. The existing frozen-install, build and product checks remain required.', '```json', json.dumps(identity, sort_keys=True), '```']
          for title, data in [('Lockfile candidate (gzip/base64)', lock), ('Full npm audit (gzip/base64)', audit.stdout)]:
              payload = base64.b64encode(gzip.compress(data, mtime=0)).decode('ascii')
              parts += ['<details><summary>' + title + '</summary>', '<pre>' + payload + '</pre>', '</details>']
          summary = '\n\n'.join(parts) + '\n'
          if len(summary.encode()) > 900000:
              raise SystemExit('Candidate report exceeds the bounded summary size')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write(summary)
          if changed:
              raise SystemExit('Commit and review the generated lockfile, then rerun the unchanged product checks')
          if counts.get('critical', 0) or counts.get('high', 0):
              raise SystemExit('Critical or high dependency vulnerabilities remain; inspect the full audit')
